[project]
name = "dynatrace-chaos-troop"
version = "0.1.0"
description = "A troop of chaos monkeys that break Dynatrace monitoring config — scoped, reversible, and safe by design."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
http = ["httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
all = ["httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]  # CLI + real client + Swagger UI
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
troop = "troop.cli:main"
troop-web = "troop.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
